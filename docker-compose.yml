version: '2'

services:
  grafana:
    image: grafana/grafana:6.1.6
    container_name: grafana
    restart: always
    user: "104"
    depends_on:
      - prometheus
    ports:
      - 3000:3000
    volumes:
      - ./grafana/provisioning/:/etc/grafana/provisioning/

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - 9090:9090
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - weather

  weather:
    build: .
    image: weather
    container_name: weather
    restart: always
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - forecastDB
    environment:
      DB_USER: "forecast"
      DB_PASSWORD: "forecast"
      DB_NAME: "forecast"
      DB_ADDRESS: "forecastDB:5432"

  forecastDB:
    image: postgres:16-alpine
    container_name: forecastDB
    restart: always
    environment:
      POSTGRES_DB: forecast
      POSTGRES_USER: forecast
      POSTGRES_PASSWORD: forecast
    volumes:
      - ./resources/pg/init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./resources/pg/data:/usr/pgdata
    ports:
      - "5544:5432"

